name: Build Velour (macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Sign (ad-hoc) and package
        run: |
          cd build/Velour_artefacts/Release
          codesign --force --deep -s - AU/Velour.component
          codesign --force --deep -s - VST3/Velour.vst3
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Velour.component
          cp -R AU/Velour.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i velour || true
          auval -strict -v aufx Vlr1 Vlra
          ditto -c -k --keepParent AU/Velour.component "$GITHUB_WORKSPACE/Velour-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Velour-AU-${{ matrix.os }}
          path: Velour-AU.zip

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Velour (latest build)" \
              --notes "Download Velour-AU.zip, unzip it, and move Velour.component into ~/Library/Audio/Plug-Ins/Components. See README for the one-line quarantine fix." || true
          gh release upload latest Velour-AU.zip --clobber
